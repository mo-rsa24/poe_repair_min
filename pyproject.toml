[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "poe_repair"
version = "0.1.0"
description = "Per-arm LoRA repair of SDXL PoE composition on cat × dog, seed 42. Includes mono-residual diagnostic and group-A failure-case baselines."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "diffusers",
    "transformers",
    "accelerate",
    "numpy",
    "pillow",
    "matplotlib",
    "peft>=0.7",
    "wandb>=0.16",
]

[tool.setuptools.packages.find]
include = ["poe_repair*"]
